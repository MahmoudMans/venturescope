services:
  postgres-e2e:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: venturescope_e2e
      POSTGRES_USER: venturescope_e2e
      POSTGRES_PASSWORD: venturescope_e2e

    ports:
      - "55438:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U venturescope_e2e -d venturescope_e2e",
        ]

      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
